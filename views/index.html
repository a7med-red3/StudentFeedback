<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFeed | Student Feedback</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
            color: #222;
        }

        /* Header */

        header {
            background: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #292b55;
        }

        .logo span {
            color: #7065df;
        }

        header p {
            color: #777;
            font-size: 14px;
        }

        /* Main */

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 20px;
        }

        /* Form Container */

        .form-container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.05);
        }

        /* Form Header */

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .form-header h1 {
            font-size: 25px;
            color: #292b55;
            margin-bottom: 10px;
        }

        .form-header p {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
        }

        /* Inputs */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 9px;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: white;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #7065df;
            box-shadow: 0 0 0 3px rgba(112, 101, 223, 0.1);
        }

        /* Button */

        button {
            width: 100%;
            padding: 15px;
            background: #7065df;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5b50c5;
        }

        /* Footer */

        .footer-text {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 25px;
        }

        footer {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            padding: 20px;
        }

        /* Responsive */

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header p {
                font-size: 12px;
            }

            .form-container {
                padding: 25px 20px;
            }

            .form-header h1 {
                font-size: 21px;
            }
        }
    </style>
    <header>
        <div class="logo">Edu<span>Feed.</span></div>
        <p>Student Feedback Portal</p>
    </header>

    <main>
        <div class="form-container">

            <div class="form-header">
                <h1>Share Your Feedback</h1>
                <p>Your opinion helps us improve the learning experience.</p>
            </div>

            <form action="/" method="POST">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="studentName" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="course">Course Name</label>
                    <input type="text" id="course" name="courseName" placeholder="e.g. Web Development" required>
                </div>

                <div class="form-group">
                    <label for="rating">How would you rate this course?</label>

                    <select id="rating" name="rating" required>
                        <option value="" disabled selected>Select your rating</option>
                        <option value="5">Excellent</option>
                        <option value="4">Very Good</option>
                        <option value="3">Good</option>
                        <option value="2">Fair</option>
                        <option value="1">Poor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="feedback">Your Feedback</label>
                    <textarea id="feedback" name="feedback" rows="7" placeholder="Tell us about your experience..."
                        required></textarea>
                </div>

                <button type="submit">Submit Feedback →</button>

            </form>

            <p class="footer-text">
                Thank you for helping us improve ❤️
            </p>

        </div>
    </main>

    <footer>
        © 2026 EduFeed. All rights reserved.
    </footer>

</body>

</html>
